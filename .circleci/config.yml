version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Install dependencies and build
          command: mvn clean install -DskipTests

      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}

      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar
  
  test:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Run tests
          command: mvn test

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports
  
  publish:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - attach_workspace:
          at: .

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: |
            docker build -t "${DOCKER_USERNAME}/devops-demo-lesson-4.12:latest" .

      - run:
          name: Push to Docker Hub
          command: |
            printf '%s' "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker push "${DOCKER_USERNAME}/devops-demo-lesson-4.12:latest"

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Install the Render CLI
          command: |
            curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Redeploy latest image on Render and wait
          command: |
            echo "Asking Render to redeploy the latest image..."
            render deploys create "$RENDER_SERVICE_ID" --wait --confirm --output text
            echo "The new version is live on Render."


workflows:
  build_test_publish_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - publish:
          context: docker-hub
          requires:
            - test
      - deploy:
          requires:
            - publish